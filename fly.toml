# Fly.io config. `fly launch` may ask to change the app name if it's taken;
# if so, update `app` below to match.
app = "isaiahbrown-art"
primary_region = "iad"   # Ashburn, VA (atl is deprecated on Fly)

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"    # sleeps when nobody is visiting
  auto_start_machines = true     # wakes up on the next visit
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
